name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the implementation
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try or consider instead?
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this project keeps
      description: A proposal that breaks one of these needs a very good argument.
      options:
        - label: The side chat stays read-only (no write, edit, shell or MCP tools)
          required: false
        - label: No build step and no runtime dependencies
          required: false
        - label: Another plugin's UI is not hidden without an explicit opt-in
          required: false
